# setuptools>=77 validates `license` as an SPDX expression (PEP 639)
[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "twitch-archiver"
version = "4.4.8"
dependencies = [
    "requests>=2.28.0",
    "m3u8>=0.3.12",
]
authors = [
  { name="Brisppy", email="brisppy@protonmail.com" },
]
description = "A simple, fast, platform-independent tool for downloading Twitch streams, videos, and chat logs."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/Brisppy/twitch-archiver"
"Bug Tracker" = "https://github.com/Brisppy/twitch-archiver/issues"

[project.scripts]
twitch-archiver = "twitcharchiver:main"

[tool.setuptools.packages.find]
include = ["twitcharchiver*"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "pytest-timeout>=2.3.0",
    "ruff>=0.15.0",
    "tox>=4.32.0",
    "radon>=6.0.1",
    "xenon>=0.9.3",
    "vulture>=2.16",
    "pyright>=1.1.400",
    "bandit>=1.9.2",
    "pre-commit>=4.5.0",
    "mutmut>=3.8",
]

[tool.ruff]
exclude = ["docs", "tests", "mutants"]
line-length = 160
indent-width = 4

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
preview = true

# The upstream codebase predates docstring (D) and annotation (ANN) rules;
# gating on them would require reformatting most of the tree and make future
# upstream merges painful. Gate on bug classes instead: syntax errors,
# undefined names, import sorting and pyupgrade checks.
[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = ["E9", "F82", "I", "UP"]
ignore = ["F821"]

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]
pythonpath = ["."]
testpaths = [
    "tests/unit",
    "tests/integration",
]

[tool.mutmut]
source_paths = ["twitcharchiver/"]
pytest_add_cli_args_test_selection = ["tests/unit"]
pytest_add_cli_args = ["-x", "-q", "--timeout=60"]
# Log-call argument mutations can never change observable behaviour; the
# pattern skips the whole Call expression, including multi-line calls.
do_not_mutate_patterns = [
    '^\s*(logger|log|_log|self\._log)\.',
]

[tool.pyright]
exclude = ["**/__pycache__", "**/node_modules", "**/dist", "**/build", "**/venv", "**/.venv", "**/mutants"]

[tool.bandit]
exclude_dirs = [".venv", "tests", "mutants"]
# B602: ffmpeg/ffprobe are intentionally invoked through the shell; all
# interpolated paths come from sanitized output directory names
skips = ["B602"]

[tool.vulture]
exclude = ["dist", "build", "venv", ".venv", "tests", "mutants"]
ignore_decorators = ["@app.route", "@require_*"]
ignore_names = ["visit_*", "do_*", "exc_type", "ext_type", "exc_val", "exc_tb"]
min_confidence = 80
paths = ["."]
sort_by_size = true
